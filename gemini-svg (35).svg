<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e2a45" flood-opacity="0.08" />
    </filter>
    
    <!-- El Isotipo Básico (Escalado para las pruebas) -->
    <g id="logo-ribbon">
      <polygon points="-60,-40 -40,-40 -15,20 -35,20" fill="#1e2a45" />
      <path d="M -35,20 L -15,20 Q 0,55 15,20 L -5,20 Q -10,35 -35,20 Z" fill="#8fc1e0" />
      <polygon points="-5,20 15,20 40,-30 20,-30" fill="#3b6fa0" />
      <polygon points="20,-30 40,-30 80,45 60,45" fill="#1e2a45" />
      <polygon points="60,45 80,45 95,20 75,20" fill="#3b6fa0" />
    </g>

    <!-- Eje visual para mostrar el centrado -->
    <g id="eje-visual">
      <line x1="0" y1="-80" x2="0" y2="120" stroke="#8fc1e0" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
      <circle cx="0" cy="0" r="3" fill="#8fc1e0" opacity="0.6" />
    </g>
  </defs>

  <rect width="1000" height="800" fill="#f4f7f9" />
  
  <line x1="100" y1="400" x2="900" y2="400" stroke="#e2ebf3" stroke-width="2" />
  <line x1="500" y1="100" x2="500" y2="700" stroke="#e2ebf3" stroke-width="2" />

  <!-- ========================================== -->
  <!-- 1. COMPENSACIÓN ÓPTICA                     -->
  <!-- ========================================== -->
  <g transform="translate(250, 200)">
    <text x="0" y="-120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8993a3" letter-spacing="2" text-anchor="middle">1. COMPENSACIÓN ÓPTICA</text>
    
    <!-- El logo se desplaza ligeramente a la izquierda (-15px) para que su "masa" principal quede centrada, ignorando la colita derecha -->
    <use href="#eje-visual" />
    <use href="#logo-ribbon" transform="translate(-15, -20) scale(0.9)" filter="url(#shadow)" />
    
    <text x="0" y="80" font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="40" fill="#1e2a45" letter-spacing="-1" text-anchor="middle">VAGUADA</text>
    <text x="0" y="105" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#8993a3" letter-spacing="4" text-anchor="middle">SOLUCIONES AMBIENTALES</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. ALINEACIÓN A BANDERA (IZQUIERDA)        -->
  <!-- ========================================== -->
  <g transform="translate(750, 200)">
    <text x="0" y="-120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8993a3" letter-spacing="2" text-anchor="middle">2. ALINEACIÓN A LA IZQUIERDA</text>
    
    <!-- Todo alineado al margen izquierdo estricto -->
    <use href="#logo-ribbon" transform="translate(0, -20) scale(0.9)" filter="url(#shadow)" />
    
    <!-- El texto empieza exactamente donde empieza la punta superior izquierda del logo (aprox x=-54) -->
    <text x="-54" y="90" font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" fill="#1e2a45" letter-spacing="-1" text-anchor="start">VAGUADA</text>
    <text x="-50" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#8993a3" letter-spacing="4" text-anchor="start">SOLUCIONES AMBIENTALES</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. ESTRUCTURA ESCALONADA (DIAGONAL)        -->
  <!-- ========================================== -->
  <g transform="translate(250, 600)">
    <text x="0" y="-120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8993a3" letter-spacing="2" text-anchor="middle">3. ESTRUCTURA ESCALONADA</text>
    
    <!-- El logo arriba a la izquierda -->
    <use href="#logo-ribbon" transform="translate(-20, -30) scale(0.8)" filter="url(#shadow)" />
    
    <!-- El texto fluye siguiendo la diagonal del logo -->
    <text x="-10" y="55" font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" fill="#1e2a45" letter-spacing="-1" text-anchor="start">VAGUADA</text>
    <text x="35" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#8993a3" letter-spacing="4" text-anchor="start">SOLUCIONES AMBIENTALES</text>
    
    <!-- Línea conectora sutil -->
    <line x1="-8" y1="75" x2="25" y2="75" stroke="#8fc1e0" stroke-width="2" />
  </g>

  <!-- ========================================== -->
  <!-- 4. ENMARQUE DE ESPACIO NEGATIVO            -->
  <!-- ========================================== -->
  <g transform="translate(750, 600)">
    <text x="0" y="-120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#8993a3" letter-spacing="2" text-anchor="middle">4. ENMARQUE (ESPACIO NEGATIVO)</text>
    
    <!-- El logo centrado pero abrazando el texto con la A final -->
    <use href="#logo-ribbon" transform="translate(0, -35) scale(0.9)" filter="url(#shadow)" />
    
    <!-- El texto se encaja debajo de la V izquierda, usando el hueco que deja la colita derecha -->
    <text x="-20" y="60" font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" fill="#1e2a45" letter-spacing="-1" text-anchor="end">VAGUADA</text>
    <text x="-20" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="9" fill="#8993a3" letter-spacing="3" text-anchor="end">SOLUCIONES AMBIENTALES</text>
    
    <!-- Un acento visual a la derecha para equilibrar -->
    <circle cx="0" cy="50" r="4" fill="#8fc1e0" />
  </g>
</svg>
