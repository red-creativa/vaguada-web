<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="200" height="200">
  <!-- Logo tal como se usa en el sitio: chip navy + cinta con degradé de 5 tonos (marrón → verde turbio → teal → celeste → cian claro)
       y partículas, representando la depuración de un efluente. -->
  <rect width="40" height="40" rx="9" fill="#1e2a45" />
  <svg x="3" y="10" width="34" height="21" viewBox="-62 -42 159 99" fill="none">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#705b41" />
        <stop offset="100%" stop-color="#4e6b45" />
      </linearGradient>
      <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#3d5e41" />
        <stop offset="100%" stop-color="#2a666b" />
      </linearGradient>
      <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a666b" />
        <stop offset="100%" stop-color="#429db5" />
      </linearGradient>
      <linearGradient id="g4" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#429db5" />
        <stop offset="100%" stop-color="#75cbe3" />
      </linearGradient>
      <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#75cbe3" />
        <stop offset="100%" stop-color="#d4f6ff" />
      </linearGradient>
      <clipPath id="clip1"><polygon points="-60,-40 -40,-40 -15,20 -35,20" /></clipPath>
      <clipPath id="clip3"><polygon points="-5,20 15,20 40,-30 20,-30" /></clipPath>
    </defs>

    <!-- Efluente crudo: sólidos en suspensión -->
    <g style="mix-blend-mode: multiply;">
      <polygon points="-60,-40 -40,-40 -15,20 -35,20" fill="url(#g1)" />
      <g clip-path="url(#clip1)" fill="#3a2f1f">
        <circle cx="-52" cy="-32" r="1.6" /><circle cx="-46" cy="-20" r="1" />
        <circle cx="-49" cy="-8" r="1.8" /><circle cx="-40" cy="2" r="1.3" />
        <circle cx="-42" cy="12" r="2" /><circle cx="-30" cy="16" r="1.4" />
        <circle cx="-24" cy="15" r="1.7" />
      </g>
    </g>

    <!-- Zona de choque / decantación -->
    <path d="M -35,20 L -15,20 Q 0,55 15,20 L -5,20 Q -10,35 -35,20 Z" fill="url(#g2)" />

    <!-- Primera clarificación: burbujas de oxigenación -->
    <g>
      <polygon points="-5,20 15,20 40,-30 20,-30" fill="url(#g3)" />
      <g clip-path="url(#clip3)" fill="#ffffff" opacity="0.6">
        <circle cx="8" cy="-20" r="1" /><circle cx="18" cy="-14" r="1.6" />
        <circle cx="12" cy="-5" r="0.8" /><circle cx="24" cy="-2" r="1.3" />
        <circle cx="20" cy="8" r="1.9" /><circle cx="30" cy="12" r="1" />
      </g>
    </g>

    <!-- Depuración final -->
    <polygon points="20,-30 40,-30 80,45 60,45" fill="url(#g4)" />

    <!-- Salida limpia -->
    <polygon points="60,45 80,45 95,20 75,20" fill="url(#g5)" />
  </svg>
</svg>
